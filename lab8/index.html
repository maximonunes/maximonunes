<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja DEISI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Loja DEISI</h1>
      <nav>
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="produtos">
        <h2>Selecione os seus Produtos</h2>

        <div id="controlos">
          <label
            >Filtrar
            <select id="filtro">
              <option value="">Todas as categorias</option>
            </select>
          </label>

          <label
            >Ordenar
            <select id="ordem">
              <option value="">Ordenar pelo preço</option>
              <option value="desc">Preço Decrescente</option>
              <option value="asc">Preço Crescente</option>
            </select>
          </label>

          <label
            >Procurar
            <input
              id="pesquisa"
              type="text"
              placeholder="pesquise por produto"
            />
          </label>
        </div>

        <p id="mensagem-produtos"></p>
        <div id="lista-produtos"></div>
      </section>

      <section id="cesto">
        <h2>Cesto</h2>
        <div id="lista-cesto"></div>

        <div id="checkout">
          <p id="total">Custo total: 0.00 €</p>

          <label
            >És estudante do DEISI?
            <input type="checkbox" id="estudante" />
          </label>

          <label
            >Cupão de desconto:
            <input type="text" id="cupao" />
          </label>

          <button id="comprar" type="button">Comprar</button>

          <p id="valor-final"></p>
          <p id="referencia"></p>
        </div>
      </section>
    </main>

    <footer></footer>

    <script src="main.js"></script>
  </body>
</html>
